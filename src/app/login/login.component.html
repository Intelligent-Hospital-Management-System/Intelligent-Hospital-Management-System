<div class="login-container">
  <div class="login-card">
    <img src="/img/IHMS.png" [alt]="'LOGIN.LOGO' | translate" class="login-logo" />
    <h1 class="login-title">{{ 'LOGIN.TITLE' | translate }}</h1>
    <p class="login-subtitle">{{ 'LOGIN.SUBTITLE' | translate }}</p>

    <button class="login-button" (click)="login()" [disabled]="isLoading() || isCheckingSession()">
      <span *ngIf="!isLoading() && !isCheckingSession()">{{ 'LOGIN.BUTTON' | translate }}</span>
      <div *ngIf="isLoading() || isCheckingSession()" class="spinner"></div>
    </button>
  </div>
</div>
